apiVersion: v1
kind: Service
metadata:
  name: vire-gateway
  labels:
    app.kubernetes.io/name: vire
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vire
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
