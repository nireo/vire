apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vire-gateway
  labels:
    app.kubernetes.io/name: vire
    app.kubernetes.io/component: gateway
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: vire
      app.kubernetes.io/component: gateway
