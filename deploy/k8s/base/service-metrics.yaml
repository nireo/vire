apiVersion: v1
kind: Service
metadata:
  name: vire-gateway-metrics
  labels:
    app.kubernetes.io/name: vire
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vire
    app.kubernetes.io/component: gateway
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
      appProtocol: http
