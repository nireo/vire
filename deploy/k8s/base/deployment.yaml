apiVersion: apps/v1
kind: Deployment
metadata:
  name: vire-gateway
  labels:
    app.kubernetes.io/name: vire
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 3
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vire
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vire
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: vire-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vire
              app.kubernetes.io/component: gateway
      containers:
        - name: gateway
          image: ghcr.io/nireo/vire:unconfigured
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8080
            - -registry=/etc/vire/models.json
            - -metrics-addr=:9091
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /etc/vire
              readOnly: true
      volumes:
        - name: models
          configMap:
            name: vire-models
            defaultMode: 0444
