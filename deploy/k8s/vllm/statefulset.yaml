apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vire-vllm
  labels:
    app.kubernetes.io/name: vire
    app.kubernetes.io/component: vllm
spec:
  serviceName: vire-vllm-headless
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vire
      app.kubernetes.io/component: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vire
        app.kubernetes.io/component: vllm
    spec:
      terminationGracePeriodSeconds: 330
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
          args:
            - Qwen/Qwen2.5-0.5B-Instruct
            - --revision
            - 7ae557604adf67be50417f59c2c2f167def9a775
            - --served-model-name
            - qwen2.5-0.5b-instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --enable-prefix-caching
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              nvidia.com/gpu: "1"
